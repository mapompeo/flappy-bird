name: Build WebGL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.38f1
          targetPlatform: WebGL
          buildsPath: build

      - name: Copy build to webgl-build
        run: |
          rm -rf webgl-build/Build webgl-build/TemplateData
          cp -r build/WebGL/WebGL/. webgl-build/

      - name: Decompress gz files and fix index.html
        run: |
          cd webgl-build/Build
          for f in *.gz; do gunzip -k "$f"; done
          cd ../..
          sed -i 's/WebGL\.framework\.js\.gz/WebGL\.framework\.js/g' webgl-build/index.html
          sed -i 's/WebGL\.data\.gz/WebGL\.data/g' webgl-build/index.html
          sed -i 's/WebGL\.wasm\.gz/WebGL\.wasm/g' webgl-build/index.html

      - name: Apply fullscreen scale
        run: |
          python3 << 'EOF'
          import re

          with open('webgl-build/index.html', 'r') as f:
              html = f.read()

          scale_js = """
            function scaleToFit() {
              var scaleX = window.innerWidth / 960;
              var scaleY = window.innerHeight / 600;
              var scale = Math.min(scaleX, scaleY);
              container.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
            }
            scaleToFit();
            window.addEventListener("resize", scaleToFit);
          """

          html = re.sub(
              r'(canvas\.style\.height\s*=\s*"600px"\s*;)',
              r'\1' + scale_js,
              html
          )

          with open('webgl-build/index.html', 'w') as f:
              f.write(html)
          EOF

          cat >> webgl-build/TemplateData/style.css << 'EOF'

          #unity-footer { display: none !important; }
          body { background: #231F20; overflow: hidden; }
          EOF

      - name: Commit and push build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webgl-build/
          git diff --staged --quiet || git commit -m "ci: update WebGL build [skip ci]"
          git push
