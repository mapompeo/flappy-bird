name: Acquire Unity License

on:
  workflow_dispatch: # roda manualmente uma única vez

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Request Unity license file
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.3.38f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-activation-file
          path: ./*.alf
